name: OpenRide CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...
      - name: Compile runnable example
        run: go build ./examples/minimal

  modules:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/modules-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - run: go test ./...
      - run: go vet ./...

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run validate
      - name: Verify package contents
        run: npm pack --dry-run

  sdk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - name: Verify package contents
        run: npm pack --dry-run

  sdk-edge-marketplace-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate E2E compose
        run: docker compose -f docker-compose.e2e.yml config --quiet
      - name: Boot authenticated Edge and Marketplace topology
        run: docker compose -f docker-compose.e2e.yml up -d --build --wait
      - name: Run SDK through Edge into Marketplace
        env:
          OPENRIDE_E2E_BASE_URL: http://127.0.0.1:18080
        run: node packages/sdk/test/e2e-marketplace.mjs
      - name: Dump E2E service logs on failure
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.e2e.yml down -v --remove-orphans

  marketplace-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Verify module resolves without root go.work
        run: GOWORK=off go mod download
      - run: GOWORK=off go test ./...
      - run: GOWORK=off go vet ./...

  marketplace-postgres-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: false
      - name: Start Marketplace PostgreSQL
        run: docker compose -f docker-compose.microservices.yml up -d --wait marketplace-db
      - name: Create isolated test database
        run: docker compose -f docker-compose.microservices.yml exec -T marketplace-db createdb -U marketplace marketplace_test
      - name: Apply Marketplace migrations to test database
        run: |
          for file in services/marketplace/migrations/*.sql; do
            echo "Applying $file"
            docker compose -f docker-compose.microservices.yml exec -T marketplace-db psql -U marketplace -d marketplace_test -v ON_ERROR_STOP=1 < "$file"
          done
      - name: Run high-contention acceptance test
        working-directory: services/marketplace
        env:
          MARKETPLACE_TEST_DATABASE_URL: postgres://marketplace:marketplace-dev@127.0.0.1:55433/marketplace_test?sslmode=disable
        run: GOWORK=off go test ./internal/store -run TestAcceptQuoteHighContentionPostgres -count=1 -v
      - name: Dump Marketplace PostgreSQL logs on failure
        if: failure()
        run: docker compose -f docker-compose.microservices.yml logs --no-color marketplace-db
      - if: always()
        run: docker compose -f docker-compose.microservices.yml down -v --remove-orphans

  microservices-topology:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate microservices compose
        run: docker compose -f docker-compose.microservices.yml config --quiet
      - name: Validate compatibility compose
        run: docker compose config --quiet
      - name: Validate E2E compose
        run: docker compose -f docker-compose.e2e.yml config --quiet
      - name: Build Marketplace image from repository root
        run: docker build -f services/marketplace/Dockerfile -t openride/marketplace:ci .
      - name: Build compatibility API image from isolated service context
        run: docker build -t openride/compatibility-api:ci services/api
      - name: Boot first microservices vertical slice
        run: docker compose -f docker-compose.microservices.yml up -d --build --wait
      - name: Verify Marketplace health and readiness
        run: |
          curl --fail --silent --show-error http://127.0.0.1:8090/healthz
          curl --fail --silent --show-error http://127.0.0.1:8090/readyz
      - name: Dump microservices logs on failure
        if: failure()
        run: docker compose -f docker-compose.microservices.yml logs --no-color
      - if: always()
        run: docker compose -f docker-compose.microservices.yml down -v --remove-orphans

  compatibility-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: services/api/go.sum
      - run: go test ./...
      - run: go vet ./...

  persistence-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache-dependency-path: services/api/go.sum
      - name: Start compatibility PostGIS and Redis
        run: docker compose up -d --wait postgres redis
      - name: Run persistent compatibility lifecycle
        working-directory: services/api
        env:
          # Legacy test flag retained until the V1 persistence suite is retired.
          FLASHX_INTEGRATION: '1'
          PERSISTENCE: postgres
          DATABASE_URL: postgres://flashx:flashx@127.0.0.1:55432/flashx?sslmode=disable
          REDIS_ADDR: 127.0.0.1:6379
        run: go test ./internal/platform/persistence -v
      - name: Dump service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down -v --remove-orphans

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: npm ci
      - run: npm run build

  rider:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/rider
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://staging.example.invalid

  driver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/driver
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart analyze
      - run: flutter test
      - run: flutter build apk --debug --dart-define=API_BASE_URL=https://staging.example.invalid
