services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: flashx
      POSTGRES_USER: flashx
      POSTGRES_PASSWORD: flashx
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - flashx_postgres:/var/lib/postgresql/data
      - ./infrastructure/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flashx -d flashx"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - flashx_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flashx_postgres:
  flashx_redis:
